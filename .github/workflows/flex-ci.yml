name: Flex CI Coverage

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  flex-test:
    runs-on: ubuntu-latest

    container:
      image: jasonrivers/apache-flex

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Flex environment
        run: |
          echo "FLEX_HOME=$FLEX_HOME"
          ant -version
          mxmlc -version || true

      - name: Run FlexUnit tests (coverage)
        run: ant test

      # Enable ONLY after Sonar permission is granted
