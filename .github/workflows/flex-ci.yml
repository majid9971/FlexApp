name: Flex CI with Coverage

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  flex-build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 1. Checkout source code
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2. Setup Java (Flex 4.x needs Java 8/11)
      # -------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      # -------------------------------------------------
      # 3. Install Apache Flex SDK
      # -------------------------------------------------
      - name: Install Flex SDK
        run: |
          wget https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz
          tar -xzf apache-flex-sdk-4.16.1-bin.tar.gz
          echo "FLEX_HOME=$PWD/apache-flex-sdk-4.16.1-bin" >> $GITHUB_ENV

      # -------------------------------------------------
      # 4. Install Flash playerglobal (REQUIRED)
      # -------------------------------------------------
      - name: Install Flex dependencies (playerglobal via installer)
        run: |
          cd $FLEX_HOME
          chmod +x installer
          echo "y" | ./installer -q


      # -------------------------------------------------
      # 5. Install Apache Ant
      # -------------------------------------------------
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      # -------------------------------------------------
      # 6. Verify Flex installation (safe check)
      # -------------------------------------------------
      - name: Verify Flex SDK
        run: |
          echo "FLEX_HOME=$FLEX_HOME"
          ls $FLEX_HOME/bin
          ls $FLEX_HOME/frameworks/libs/player/32.0/playerglobal.swc

      # -------------------------------------------------
      # 7. Run Flex build & tests
      # -------------------------------------------------
      - name: Run Ant tests
        run: ant test

