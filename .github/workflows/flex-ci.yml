name: Flex CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  flex-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Download Apache Flex SDK
        run: |
          wget https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz
          tar -xzf apache-flex-sdk-4.16.1-bin.tar.gz
          echo "FLEX_HOME=$PWD/apache-flex-sdk-4.16.1-bin" >> $GITHUB_ENV

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Verify Flex Ant Tasks
        run: |
          ls $FLEX_HOME/ant/lib

      - name: Compile Flex App
        run: ant compile
