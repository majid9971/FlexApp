name: Flex CI Coverage

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  flex-test:
    runs-on: ubuntu-latest

    container:
      image: jasonrivers/flex-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Flex SDK
        run: |
          echo "FLEX_HOME=$FLEX_HOME"
          ls $FLEX_HOME/bin
          ls $FLEX_HOME/ant/lib

      - name: Run FlexUnit tests with coverage
        run: ant test

