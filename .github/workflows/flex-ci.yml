name: Flex CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  flex-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Install Flex SDK
        run: |
          wget https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz
          tar -xzf apache-flex-sdk-4.16.1-bin.tar.gz
          echo "FLEX_HOME=$PWD/apache-flex-sdk-4.16.1-bin" >> $GITHUB_ENV

      - name: Install playerglobal
        run: |
          mkdir -p $FLEX_HOME/frameworks/libs/player/27.0
          wget https://archive.apache.org/dist/flex/4.16.1/playerglobal/playerglobal.swc \
            -O $FLEX_HOME/frameworks/libs/player/27.0/playerglobal.swc

      - name: Run Ant tests
        run: ant test
