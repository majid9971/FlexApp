name: Flex CI Coverage

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  flex-test:
    runs-on: ubuntu-latest

    container:
      image: apache/flex:4.16.1

    steps:
      - uses: actions/checkout@v4

      - name: Run FlexUnit tests with coverage
        run: ant test

