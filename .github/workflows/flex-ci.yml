name: Flex CI Coverage

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  flex-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Flex Docker image
        run: docker build -t flex-ci .

      - name: Run Flex tests with coverage
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            flex-ci ant test

