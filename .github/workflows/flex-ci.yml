name: Flex CI with Coverage

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  flex-build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 1. Checkout source code
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2. Setup Java (Flex 4.x compatible)
      # -------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      # -------------------------------------------------
      # 3. Install Apache Flex SDK using official installer
      #    (downloads playerglobal legally, CI-safe)
      # -------------------------------------------------
      - name: Install Apache Flex SDK
        run: |
          wget https://downloads.apache.org/flex/sdk-installer/apache-flex-sdk-installer-3.3.1-bin.zip
          unzip apache-flex-sdk-installer-3.3.1-bin.zip
          cd apache-flex-sdk-installer-3.3.1-bin
          chmod +x apache-flex-sdk-installer
          echo "y" | ./apache-flex-sdk-installer \
            -sdk 4.16.1 \
            -directory $HOME/flexsdk \
            -air 33.1 \
            -flash 32.0
          echo "FLEX_HOME=$HOME/flexsdk" >> $GITHUB_ENV

      # -------------------------------------------------
      # 4. Install Apache Ant
      # -------------------------------------------------
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      # -------------------------------------------------
      # 5. Verify Flex SDK installation
      # -------------------------------------------------
      - name: Verify Flex SDK
        run: |
          echo "FLEX_HOME=$FLEX_HOME"
          ls $FLEX_HOME/bin/mxmlc
          ls $FLEX_HOME/frameworks/libs/player

      # -------------------------------------------------
      # 6. Run Ant build / tests
      # -------------------------------------------------
      - name: Run Ant tests
        run: ant test

      # -------------------------------------------------
      # 7. SonarQube Scan (ENABLE AFTER PERMISSION)
      # -------------------------------------------------
      # - name: SonarQube Scan
      #   uses: SonarSource/sonarqube-scan-action@v2
