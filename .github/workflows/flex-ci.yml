name: Flex CI with Coverage

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  flex-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Apache Flex SDK (CI-safe)
        run: |
          wget https://archive.apache.org/dist/flex/flex-sdk-installer/3.3.1/apache-flex-sdk-installer-3.3.1-bin.tar.gz
          tar -xzf apache-flex-sdk-installer-3.3.1-bin.tar.gz
          cd apache-flex-sdk-installer-3.3.1-bin
          echo "y" | ./apache-flex-sdk-installer \
            -sdk 4.16.1 \
            -directory $HOME/flexsdk \
            -air 33.1 \
            -flash 32.0
          echo "FLEX_HOME=$HOME/flexsdk" >> $GITHUB_ENV

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Verify Flex SDK
        run: |
          echo "FLEX_HOME=$FLEX_HOME"
          ls $FLEX_HOME/bin/mxmlc
          ls $FLEX_HOME/frameworks/libs/player

      - name: Run Ant tests
        run: ant test

      # SonarQube step (enable after permission)
