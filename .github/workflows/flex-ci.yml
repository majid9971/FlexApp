name: Flex CI Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  flex-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Apache Flex SDK via Installer
        run: |
          wget https://archive.apache.org/dist/flex/sdk-installer/3.3.1/binaries/apache-flex-sdk-installer-3.3.1-bin.zip
          unzip apache-flex-sdk-installer-3.3.1-bin.zip
          cd apache-flex-sdk-installer-3.3.1-bin
          chmod +x apache-flex-sdk-installer
          echo "y" | ./apache-flex-sdk-installer \
            -sdk 4.16.1 \
            -directory $HOME/flexsdk \
            -flash 27.0 \
            -air 27.0

          echo "FLEX_HOME=$HOME/flexsdk" >> $GITHUB_ENV

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Verify playerglobal
        run: |
          ls $FLEX_HOME/frameworks/libs/player/27.0/playerglobal.swc

      - name: Compile Flex App
        run: ant compile
