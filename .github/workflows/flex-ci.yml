name: Flex CI with Coverage

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  flex-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Flex SDK
        run: |
         wget https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz
         tar -xzf apache-flex-sdk-4.16.1-bin.tar.gz

         FLEX_DIR=$(ls -d apache-flex-sdk-*-bin | head -n 1)
         echo "FLEX_HOME=$PWD/$FLEX_DIR" >> $GITHUB_ENV

      - name: Install Ant
        run: sudo apt-get install -y ant

      - name: Verify Flex SDK
        run: |
          echo "FLEX_HOME=$FLEX_HOME"
          ls $FLEX_HOME
          ls $FLEX_HOME/bin

      - name: Run tests
        run: ant test

