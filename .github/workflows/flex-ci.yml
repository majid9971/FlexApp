name: Flex CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  flex-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Apache Flex SDK (from Maven Central)
        run: |
          wget https://repo1.maven.org/maven2/org/apache/flex/sdk/apache-flex-sdk/4.16.1/apache-flex-sdk-4.16.1-bin.tar.gz
          tar -xzf apache-flex-sdk-4.16.1-bin.tar.gz
          mv apache-flex-sdk-4.16.1 $HOME/flexsdk
          echo "FLEX_HOME=$HOME/flexsdk" >> $GITHUB_ENV

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Verify Flex SDK
        run: |
          echo "FLEX_HOME=$FLEX_HOME"
          ls $FLEX_HOME/bin/mxmlc

      - name: Run Ant build
        run: ant test

      # SonarQube (enable later)
